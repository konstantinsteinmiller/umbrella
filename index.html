<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <!-- ?art=kite → the painted kite build (public/js/art-kite-redirect.js); a no-op everywhere else. -->
  <script src="/js/art-kite-redirect.js"></script>
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico">
  <!--
    YouTube Playables SDK. Kept ONLY on the Playgama build — that archive is
    also the Playables submission — and stripped from every other build by
    vite.config.ts. Load-bearing there: the Playgama Bridge's `youtube`
    adapter waits for `window.ytgame` with a 100ms poll that has NO timeout,
    so without this tag `bridge.initialize()` never settles and the game
    "does not start". YouTube requires it before any game code, hence the
    position.
  -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <!--
    Web Storage shim. MUST stay the first of OUR scripts and MUST stay a
    classic (non-module) tag: module scripts are deferred, so a shim installed
    from inside the module graph runs AFTER the entry chunk's static imports
    have already evaluated — and several of those read `localStorage` at
    module scope (`useMatch.ts`). On YouTube Playables `window.localStorage`
    is **null**, not absent, so those reads throw before `bootstrap()` gets a
    chance to defend itself. Ships on every build: sandboxed iframes and
    blocked-storage embeds fail identically.
  -->
  <script src="/js/storage-shim.js"></script>
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="umbrella">
  <link rel="manifest" href="/manifest.json">
  <title>umbrella</title>
  <style>
      body {
          margin: 0;
          background-color: #070a14;
          outline: none;
      }
      #static-splash {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; align-items: center; justify-content: center;
          background-color: #070a14;
          transition: opacity 0.4s ease-out;
      }
      #static-splash.hidden { opacity: 0; pointer-events: none; }
      #static-splash .splash-logo {
          color: #ffb15a; font-family: 'Angry', sans-serif; font-weight: 900;
          font-size: 9vmin; text-align: center; letter-spacing: 0.06em;
          animation: splash-pulse 1.5s ease-in-out infinite;
          line-height: 1.05;
      }
      @keyframes splash-pulse {
          0%, 100% { opacity: 0.3; }
          50% { opacity: 0.85; }
      }
  </style>
</head>
<body>
<div id="static-splash">
</div>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- No Playgama Bridge tag: v2 is bundled from the @playgama/bridge npm
     package (see src/utils/playgamaBridgeLoader.ts). The CDN build fetches
     adapter chunks at runtime and posts to api.playgama.com, neither of which
     YouTube Playables permits — and the Playgama archive IS the Playables
     submission. -->
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<!-- Poki SDK - stripped for non-Poki builds by vite.config.ts -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
