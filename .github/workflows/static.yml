name: Deploy Static Content to Pages

# Publishes:
#   /umbrella/      → latest main
#   /umbrella/<N>/  → every GDD revision (N = scripts/revision.mjs)
#   /umbrella/sounds/ → sound + music listening page (latest)
#
# Each push to main moves the tag `revision-<current N>` to that commit, so a
# revision's URL keeps following main until the GDD opens the next revision;
# from then on the old tag is frozen and its build is rebuilt from the tag.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # push the revision-<N> tag
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  VITE_APP_TURN_USERNAME: ${{ secrets.VITE_APP_TURN_USERNAME }}
  VITE_APP_TURN_CREDENTIAL: ${{ secrets.VITE_APP_TURN_CREDENTIAL }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0 # revision tags

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.8.0'

      - name: Current revision
        id: rev
        working-directory: main
        run: echo "n=$(node scripts/revision.mjs)" >> "$GITHUB_OUTPUT"

      - name: Tag this commit as the current revision
        working-directory: main
        run: |
          git tag -f "revision-${{ steps.rev.outputs.n }}"
          git push -f origin "refs/tags/revision-${{ steps.rev.outputs.n }}"

      - name: Install dependencies (main)
        working-directory: main
        run: pnpm install --no-frozen-lockfile

      - name: Build latest → /umbrella/
        working-directory: main
        run: npx vite build --base=/umbrella/ --outDir="$GITHUB_WORKSPACE/dist"

      - name: Build current revision → /umbrella/<N>/
        working-directory: main
        run: |
          N="${{ steps.rev.outputs.n }}"
          npx vite build --base="/umbrella/$N/" --outDir="$GITHUB_WORKSPACE/dist/$N"

      - name: Build sound listening page → /umbrella/sounds/
        working-directory: main
        run: |
          npx vite build --config scripts/sfx/vite.sounds.config.mjs --base=/umbrella/sounds/ --outDir="$GITHUB_WORKSPACE/dist/sounds"
          mv "$GITHUB_WORKSPACE/dist/sounds/umbrella-sounds.html" "$GITHUB_WORKSPACE/dist/sounds/index.html"

      - name: Build earlier revisions from their tags
        working-directory: main
        run: |
          CUR="${{ steps.rev.outputs.n }}"
          for TAG in $(git tag --list 'revision-*'); do
            N="${TAG#revision-}"
            [ "$N" = "$CUR" ] && continue
            echo "::group::revision $N ($TAG)"
            git worktree add --detach "../rev-$N" "$TAG"
            (cd "../rev-$N" && pnpm install --no-frozen-lockfile \
              && npx vite build --base="/umbrella/$N/" --outDir="$GITHUB_WORKSPACE/dist/$N")
            echo "::endgroup::"
          done

      - name: Revision index (dist/revisions.json)
        working-directory: main
        run: |
          git tag --list 'revision-*' | sed 's/revision-//' | sort -n \
            | node -e "const n=require('fs').readFileSync(0,'utf8').trim().split('\n').filter(Boolean).map(Number);console.log(JSON.stringify({latest:${{ steps.rev.outputs.n }},revisions:n}))" \
            > "$GITHUB_WORKSPACE/dist/revisions.json"
          cat "$GITHUB_WORKSPACE/dist/revisions.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
