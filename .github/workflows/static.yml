name: Deploy Static Content to Pages

# Publishes:
#   /umbrella/      → latest main
#   /umbrella/<N>/  → every GDD revision (N = scripts/revision.mjs)
#   (the kite build, /umbrella/kite/, is no longer built: obsolete for now)
#   /umbrella/lantern/ → the normal game in the painted "Paper Moon" lantern art; opened by
#                     `?art=lantern` (and /umbrella/<N>/lantern/ per revision from 11 on)
#   /umbrella/sounds/ → sound + music listening page (latest)
#   /umbrella/art-moodboards/ → art-concept rating page (static, from art-moodboards/)
#   /umbrella/competitors/ → competitor + market report (static, from competitors/)
#
# Each push to main moves the tag `revision-<current N>` to that commit, so a
# revision's URL keeps following main until the GDD opens the next revision;
# from then on the old tag is frozen and its build is rebuilt from the tag.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # push the revision-<N> tag
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Queue, never cancel: a cancelled run cannot save the old-revisions cache or finish its deploy.
  cancel-in-progress: false

env:
  VITE_APP_TURN_USERNAME: ${{ secrets.VITE_APP_TURN_USERNAME }}
  VITE_APP_TURN_CREDENTIAL: ${{ secrets.VITE_APP_TURN_CREDENTIAL }}
  # The levels bucket (workers/levels-bucket): the Pages editor syncs with it, the
  # Pages game plays its campaign edits, and every build here pulls it first.
  VITE_APP_LEVELS_BUCKET_URL: https://umbrella-levels.playtest-circle.workers.dev
  # The pre-game intro cutscene (and the "click to play" screen that only served it): off. Set 'true' to bring it back
  # on the Pages builds (portal builds read VITE_APP_INTRO_ENABLED from the root .env).
  VITE_APP_INTRO_ENABLED: 'false'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0 # revision tags

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.8.0'

      - name: Current revision
        id: rev
        working-directory: main
        run: echo "n=$(node scripts/revision.mjs)" >> "$GITHUB_OUTPUT"

      - name: Tag this commit as the current revision
        working-directory: main
        run: |
          git tag -f "revision-${{ steps.rev.outputs.n }}"
          git push -f origin "refs/tags/revision-${{ steps.rev.outputs.n }}"

      - name: Install dependencies (main)
        working-directory: main
        run: pnpm install --no-frozen-lockfile

      - name: Build latest → /umbrella/
        working-directory: main
        run: npx vite build --base=/umbrella/ --outDir="$GITHUB_WORKSPACE/dist"

      - name: Build current revision → /umbrella/<N>/
        working-directory: main
        run: |
          N="${{ steps.rev.outputs.n }}"
          npx vite build --base="/umbrella/$N/" --outDir="$GITHUB_WORKSPACE/dist/$N"

      - name: Build current revision's lantern art → /umbrella/<N>/lantern/ (from revision 11)
        working-directory: main
        env:
          VITE_APP_LANTERN: 'true'
        run: |
          N="${{ steps.rev.outputs.n }}"
          if [ "$N" -ge 11 ]; then
            npx vite build --mode lantern --base="/umbrella/$N/lantern/" --outDir="$GITHUB_WORKSPACE/dist/$N/lantern"
          fi

      - name: Build current revision's clay art → /umbrella/<N>/clay/ (from revision 12)
        working-directory: main
        env:
          VITE_APP_CLAY: 'true'
        run: |
          N="${{ steps.rev.outputs.n }}"
          if [ "$N" -ge 12 ]; then
            npx vite build --mode clay --base="/umbrella/$N/clay/" --outDir="$GITHUB_WORKSPACE/dist/$N/clay"
          fi

      - name: Build clay art (the normal game, claymation) → /umbrella/clay/
        working-directory: main
        env:
          VITE_APP_CLAY: 'true'
        run: npx vite build --mode clay --base=/umbrella/clay/ --outDir="$GITHUB_WORKSPACE/dist/clay"

      - name: Build lantern art (the normal game, painted) → /umbrella/lantern/
        working-directory: main
        env:
          VITE_APP_LANTERN: 'true'
        run: npx vite build --mode lantern --base=/umbrella/lantern/ --outDir="$GITHUB_WORKSPACE/dist/lantern"

      - name: Build sound listening page → /umbrella/sounds/
        working-directory: main
        run: |
          npx vite build --config scripts/sfx/vite.sounds.config.mjs --base=/umbrella/sounds/ --outDir="$GITHUB_WORKSPACE/dist/sounds"
          mv "$GITHUB_WORKSPACE/dist/sounds/umbrella-sounds.html" "$GITHUB_WORKSPACE/dist/sounds/index.html"

      - name: Art-concept moodboards → /umbrella/art-moodboards/
        working-directory: main
        run: cp -r art-moodboards "$GITHUB_WORKSPACE/dist/art-moodboards"

      - name: Competitor report → /umbrella/competitors/
        working-directory: main
        run: cp -r competitors "$GITHUB_WORKSPACE/dist/competitors"

      # Earlier revisions are frozen: their tag never moves, so their build never changes. Each one is built
      # once into rev-cache/<N>/ (the main build, lantern and clay of that revision) and restored from the
      # Actions cache afterwards; only a revision that is new to the cache is built. The key follows the set of
      # frozen tags and their commits, so a newly frozen revision adds one build and nothing else is redone.
      # Bump CACHE_VERSION to force a rebuild of every old revision (e.g. after changing this recipe).
      - name: Frozen revisions (cache key)
        id: frozen
        working-directory: main
        env:
          CACHE_VERSION: v2
        run: |
          CUR="${{ steps.rev.outputs.n }}"
          LIST=$(for TAG in $(git tag --list 'revision-*' | sort); do
            [ "${TAG#revision-}" = "$CUR" ] && continue
            echo "$TAG $(git rev-list -n1 "$TAG")"
          done)
          echo "$LIST"
          echo "key=old-revisions-$CACHE_VERSION-$(echo "$LIST" | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore earlier revisions' builds
        uses: actions/cache@v4
        with:
          path: rev-cache
          key: ${{ steps.frozen.outputs.key }}
          restore-keys: |
            old-revisions-v2-

      - name: Build earlier revisions from their tags (only those not cached)
        working-directory: main
        run: |
          CUR="${{ steps.rev.outputs.n }}"
          CACHE="$GITHUB_WORKSPACE/rev-cache"
          mkdir -p "$CACHE"
          for TAG in $(git tag --list 'revision-*'); do
            N="${TAG#revision-}"
            [ "$N" = "$CUR" ] && continue
            if [ -f "$CACHE/$N/index.html" ]; then
              echo "revision $N: restored from cache"
              continue
            fi
            echo "::group::revision $N ($TAG)"
            rm -rf "$CACHE/$N"
            git worktree add --detach "../rev-$N" "$TAG"
            (cd "../rev-$N" && pnpm install --no-frozen-lockfile               && npx vite build --base="/umbrella/$N/" --outDir="$CACHE/$N")
            if [ -f "../rev-$N/src/umbrella/art/lantern.ts" ]; then
              (cd "../rev-$N" && VITE_APP_LANTERN=true                 npx vite build --mode lantern --base="/umbrella/$N/lantern/" --outDir="$CACHE/$N/lantern")
            fi
            if [ -f "../rev-$N/src/umbrella/art/clay.ts" ]; then
              (cd "../rev-$N" && VITE_APP_CLAY=true                 npx vite build --mode clay --base="/umbrella/$N/clay/" --outDir="$CACHE/$N/clay")
            fi
            echo "::endgroup::"
          done
          # A revision whose tag is gone (or now the current one) must not linger from an older cache.
          for D in "$CACHE"/*/; do
            N=$(basename "$D")
            git rev-parse -q --verify "refs/tags/revision-$N" >/dev/null && [ "$N" != "$CUR" ] || rm -rf "$D"
          done
          cp -r "$CACHE"/. "$GITHUB_WORKSPACE/dist/"

      - name: Revision index (dist/revisions.json)
        working-directory: main
        run: |
          git tag --list 'revision-*' | sed 's/revision-//' | sort -n \
            | node -e "const n=require('fs').readFileSync(0,'utf8').trim().split('\n').filter(Boolean).map(Number);console.log(JSON.stringify({latest:${{ steps.rev.outputs.n }},revisions:n}))" \
            > "$GITHUB_WORKSPACE/dist/revisions.json"
          cat "$GITHUB_WORKSPACE/dist/revisions.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
