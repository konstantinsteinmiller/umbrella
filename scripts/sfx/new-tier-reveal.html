<!doctype html>
<meta charset="utf-8">
<title>new-tier-reveal — synth source</title>
<!--
  ─── "New tier discovered" — the reveal SFX, as a synth graph ──────────────

  The source of `public/audio/sfx/new-tier-reveal.ogg`. Rendered by
  `render-new-tier-reveal.mjs` in a private headless Chrome through an
  OfflineAudioContext, then loudness-matched and encoded by ffmpeg. Open this
  file in a browser and call `renderSfx()` in the console to poke at it.

  TIMING CONTRACT — the arena/grid halo is synced to these numbers:
    0.00–0.35 s  anticipation: reverse-cymbal noise riser, metallic sheen,
                 resonant whoosh, and a fluttering sine shimmer gliding up a
                 fifth INTO the notes of the bloom chord
    0.35 s       THE BLOOM: a strummed Dmaj9 of FM celesta + glass bells, a
                 soft sub thump, a struck-crystal "shing", an air burst and a
                 spray of high glitter grains
    0.44–1.43 s  ascending D-major-pentatonic celesta arpeggio (accelerando,
                 11 notes, D5 → D7) through a short echo, crowned by a long D7
                 with an octave halo and a second glitter spray; under it a
                 warm "aah" choir pad (Dmaj9) swelling from the bloom
    → 3.26 s     reverb tail, gently faded out; silent by ~3.3 s

  Deterministic in everything audible: every random choice (noise, glitter
  timing and pitch, detune, the room) comes from one seeded PRNG. Chrome's
  audio-rate FM and filter paths still add float jitter run to run — measured at
  about −85 dB below peak — so two renders are not byte-identical, only
  indistinguishable.
-->
<script>
(() => {
  const SR = 44100
  const BLOOM = 0.35
  const LENGTH_S = 3.36
  const FADE_START = 2.7
  const FADE_END = 3.26
  const SEED = 20260911

  /** mulberry32 — tiny, fast, seedable. */
  const prng = (seed) => () => {
    seed = (seed + 0x6d2b79f5) | 0
    let t = seed
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12)
  const T60 = 6.9078 // ln(1000): an exponential decay with tau = t60 / T60 is −60 dB at t60

  /** A generated room: bright early energy that dies fast over a darker,
   *  longer body — frequency-dependent decay, which is what reads as "hall"
   *  rather than "noise". Early reflections sharpen the onset. */
  const makeImpulse = (ctx, rand) => {
    const seconds = 2.4
    const pre = Math.round(0.016 * SR)
    const n = Math.ceil(seconds * SR)
    const buf = ctx.createBuffer(1, n, SR)
    const d = buf.getChannelData(0)
    const kBright = T60 / 0.95
    const kDark = T60 / 2.05
    let lp = 0
    for (let i = pre; i < n; i++) {
      const t = (i - pre) / SR
      const w = rand() * 2 - 1
      lp += 0.12 * (w - lp) // one-pole low-pass, ~900 Hz
      const build = Math.min(1, t / 0.012)
      d[i] = (0.5 * w * Math.exp(-kBright * t) + 1.1 * lp * Math.exp(-kDark * t)) * build
    }
    for (const [t, a] of [[0.011, 0.5], [0.019, -0.38], [0.027, 0.3], [0.034, -0.26], [0.046, 0.2], [0.058, -0.16]]) {
      d[Math.round(t * SR)] += a
    }
    return buf
  }

  /**
   * Render the SFX. `only` renders one layer (riser | bloom | arp | pad) with
   * its reverb share, for checking the mix balance by measurement; `noVerb`
   * leaves the room out (debugging).
   * @returns {{ sampleRate: number, length: number, pcm: string }} mono
   *   float32 little-endian PCM, base64.
   */
  window.renderSfx = async ({ only = null, noVerb = false } = {}) => {
    const ctx = new OfflineAudioContext(1, Math.ceil(SR * LENGTH_S), SR)
    const rand = prng(SEED)
    const between = (a, b) => a + (b - a) * rand()

    // ── Buses ─────────────────────────────────────────────────────────────
    const master = ctx.createGain()
    const hp = ctx.createBiquadFilter()
    hp.type = 'highpass'
    hp.frequency.value = 32
    hp.Q.value = 0.707
    // A gentle shelf over the top octave: the FM sidebands and glitter reach
    // 12-15 kHz, which reads as sparkle at −5 dB and as a needle at 0 dB.
    const shelf = ctx.createBiquadFilter()
    shelf.type = 'highshelf'
    shelf.frequency.value = 9500
    shelf.gain.value = -4.5
    master.connect(hp).connect(shelf).connect(ctx.destination)
    // The tail is faded rather than cut: cos² from FADE_START to FADE_END.
    const fade = new Float32Array(64)
    for (let i = 0; i < fade.length; i++) fade[i] = Math.cos((i / (fade.length - 1)) * Math.PI / 2) ** 2
    master.gain.setValueAtTime(1, 0)
    master.gain.setValueCurveAtTime(fade, FADE_START, FADE_END - FADE_START)

    const reverb = ctx.createConvolver()
    reverb.buffer = makeImpulse(ctx, prng(SEED + 1))
    const verbIn = ctx.createGain()
    const verbOut = ctx.createGain()
    verbOut.gain.value = 0.62
    if (!noVerb) verbIn.connect(reverb).connect(verbOut).connect(master)

    /** A layer: its own bus, sent dry to the master and wet to the room. */
    const layer = (name, dry, wet) => {
      const bus = ctx.createGain()
      bus.gain.value = only === null || only === name ? 1 : 0
      const d = ctx.createGain()
      d.gain.value = dry
      const w = ctx.createGain()
      w.gain.value = wet
      bus.connect(d).connect(master)
      bus.connect(w).connect(verbIn)
      return bus
    }

    // Seeded white noise, looped, read from a random offset per use.
    const noiseBuf = ctx.createBuffer(1, SR * 2, SR)
    {
      const nr = prng(SEED + 2)
      const d = noiseBuf.getChannelData(0)
      for (let i = 0; i < d.length; i++) d[i] = nr() * 2 - 1
    }
    const noise = (t0, dur) => {
      const s = ctx.createBufferSource()
      s.buffer = noiseBuf
      s.loop = true
      s.start(t0, rand() * 1.5)
      s.stop(t0 + dur)
      return s
    }

    /** Attack to `peak`, then an exponential decay reaching −60 dB at `t60`. */
    const envAD = (param, t0, peak, attack, t60) => {
      param.value = 0
      param.setValueAtTime(0, t0)
      param.linearRampToValueAtTime(peak, t0 + attack)
      param.setTargetAtTime(0, t0 + attack, t60 / T60)
    }

    /** Two-operator FM: ratio 4 → celesta/glock "ting", ratio 3.5 → glass bell. */
    const fm = ({ t0, freq, ratio, index0, index1, indexTime, peak, t60, dest, attack = 0.003, detune = 0 }) => {
      const car = ctx.createOscillator()
      car.frequency.value = freq
      car.detune.value = detune
      const mod = ctx.createOscillator()
      const mf = freq * ratio
      mod.frequency.value = mf
      const depth = ctx.createGain()
      depth.gain.setValueAtTime(index0 * mf, t0)
      depth.gain.exponentialRampToValueAtTime(Math.max(0.001, index1 * mf), t0 + indexTime)
      mod.connect(depth).connect(car.frequency)
      const amp = ctx.createGain()
      envAD(amp.gain, t0, peak, attack, t60)
      car.connect(amp).connect(dest)
      const end = t0 + t60 + 0.05
      car.start(t0)
      mod.start(t0)
      car.stop(end)
      mod.stop(end)
    }

    /** A plain decaying sine partial. */
    const partial = ({ t0, freq, peak, t60, dest, attack = 0.002 }) => {
      const o = ctx.createOscillator()
      o.frequency.value = freq
      const a = ctx.createGain()
      envAD(a.gain, t0, peak, attack, t60)
      o.connect(a).connect(dest)
      o.start(t0)
      o.stop(t0 + t60 + 0.05)
    }

    /** One glitter grain: a tiny sine that chirps up onto its note. */
    const grain = (t0, freq, peak, tau, dest) => {
      const o = ctx.createOscillator()
      o.frequency.setValueAtTime(freq * 0.985, t0)
      o.frequency.exponentialRampToValueAtTime(freq, t0 + 0.03)
      const a = ctx.createGain()
      a.gain.value = 0
      a.gain.setValueAtTime(0, t0)
      a.gain.linearRampToValueAtTime(peak, t0 + 0.0015)
      a.gain.setTargetAtTime(0, t0 + 0.0015, tau)
      o.connect(a).connect(dest)
      o.start(t0)
      o.stop(t0 + tau * 9 + 0.01)
    }

    // D major pentatonic, D7 .. A8 — the glitter stays in key.
    const GLITTER = [98, 100, 102, 105, 107, 110, 112, 114, 117].map(hz)
    const glitterSpray = (from, spread, count, level, dest) => {
      for (let i = 0; i < count; i++) {
        const u = Math.pow(rand(), 1.8) // dense at the front, thinning out
        grain(from + u * spread, GLITTER[Math.floor(rand() * GLITTER.length)], level * between(0.45, 1) * (1 - 0.55 * u), between(0.022, 0.07), dest)
      }
    }

    // ── 1. Anticipation (0.00 – 0.35) ─────────────────────────────────────
    const riser = layer('riser', 1.2, 0.75)
    {
      // Reverse cymbal: noise through a band sweeping up, swelling
      // exponentially and cut dead at the bloom.
      const n = noise(0, BLOOM + 0.02)
      const bp = ctx.createBiquadFilter()
      bp.type = 'bandpass'
      bp.Q.value = 0.8
      bp.frequency.setValueAtTime(1800, 0)
      bp.frequency.exponentialRampToValueAtTime(8200, BLOOM - 0.005)
      const hpf = ctx.createBiquadFilter()
      hpf.type = 'highpass'
      hpf.frequency.value = 1300
      const g = ctx.createGain()
      g.gain.value = 0
      g.gain.setValueAtTime(0.0006, 0)
      g.gain.exponentialRampToValueAtTime(0.42, BLOOM - 0.012)
      g.gain.linearRampToValueAtTime(0, BLOOM + 0.004)
      n.connect(bp).connect(hpf).connect(g).connect(riser)

      // Metallic sheen on the swell — inharmonic partials, so it is a cymbal
      // and not a chord.
      for (const f of [3120, 4380, 5230, 6890, 8450]) {
        const o = ctx.createOscillator()
        o.frequency.value = f
        const a = ctx.createGain()
        a.gain.value = 0
        a.gain.setValueAtTime(0.00005, 0)
        a.gain.exponentialRampToValueAtTime(0.012, BLOOM - 0.012)
        a.gain.linearRampToValueAtTime(0, BLOOM + 0.004)
        o.connect(a).connect(riser)
        o.start(0)
        o.stop(BLOOM + 0.01)
      }

      // Resonant whoosh: a low-pass sweep that pulls the ear upward.
      const w = noise(0, BLOOM + 0.02)
      const lpf = ctx.createBiquadFilter()
      lpf.type = 'lowpass'
      lpf.Q.value = 3.2
      lpf.frequency.setValueAtTime(260, 0)
      lpf.frequency.exponentialRampToValueAtTime(3400, BLOOM - 0.01)
      const wg = ctx.createGain()
      wg.gain.value = 0
      wg.gain.setValueAtTime(0.002, 0)
      wg.gain.exponentialRampToValueAtTime(0.16, BLOOM - 0.015)
      wg.gain.linearRampToValueAtTime(0, BLOOM + 0.006)
      w.connect(lpf).connect(wg).connect(riser)

      // Rising shimmer: four fluttering sines gliding up a fifth, landing ON
      // the notes the bloom chord is about to strike (A5 D6 F#6 A6).
      ;[81, 86, 90, 93].forEach((m, i) => {
        const f = hz(m)
        const o = ctx.createOscillator()
        o.frequency.setValueAtTime(f * Math.pow(2, -7 / 12), 0)
        o.frequency.exponentialRampToValueAtTime(f, BLOOM - 0.01)
        const a = ctx.createGain()
        a.gain.value = 0
        a.gain.setValueAtTime(0.0002, 0)
        a.gain.exponentialRampToValueAtTime(0.07, BLOOM - 0.01)
        a.gain.linearRampToValueAtTime(0, BLOOM + 0.04)
        const trem = ctx.createGain()
        trem.gain.value = 0.6
        const lfo = ctx.createOscillator()
        lfo.frequency.setValueAtTime(7 + i, 0)
        lfo.frequency.linearRampToValueAtTime(27 + i * 1.7, BLOOM)
        const depth = ctx.createGain()
        depth.gain.value = 0.4
        lfo.connect(depth).connect(trem.gain)
        o.connect(a).connect(trem).connect(riser)
        o.start(0)
        lfo.start(0)
        o.stop(BLOOM + 0.05)
        lfo.stop(BLOOM + 0.05)
      })
    }

    // ── 2. The bloom (0.35) ───────────────────────────────────────────────
    const bloom = layer('bloom', 1, 0.4)
    {
      // Strummed Dmaj9 — D4 D5 F#5 A5 C#6 E6 + a D7 sparkle bell. The 4-24 ms
      // strum is what makes it OPEN rather than click.
      const chord = [
        { m: 62, peak: 0.26, t60: 3.0 },
        { m: 74, peak: 0.24, t60: 2.6 },
        { m: 78, peak: 0.2, t60: 2.4 },
        { m: 81, peak: 0.19, t60: 2.3 },
        { m: 85, peak: 0.13, t60: 2.1 },
        { m: 88, peak: 0.13, t60: 2.0 },
        { m: 98, peak: 0.07, t60: 1.3 }
      ]
      chord.forEach(({ m, peak, t60 }, i) => {
        const t0 = BLOOM + i * 0.004 + (i > 0 ? 0.002 : 0)
        const f = hz(m)
        // Key-tracked brightness: the higher the note, the fewer sidebands, as in
        // any playable FM bell — otherwise the top of the chord turns to glass shards.
        const index0 = Math.max(0.6, 1.9 - 0.035 * (m - 62))
        fm({ t0, freq: f, ratio: 4, index0, index1: 0.05, indexTime: 0.22, peak, t60, dest: bloom, detune: between(-3, 3) })
        fm({ t0, freq: f, ratio: 3.5, index0: 1.2, index1: 0.1, indexTime: 0.9, peak: peak * 0.42, t60: t60 * 1.1, dest: bloom })
      })

      // Soft sub thump — a sine falling 118 → 50 Hz, plus its octave so it
      // still registers on a phone speaker.
      const sub = ctx.createOscillator()
      sub.frequency.setValueAtTime(118, BLOOM)
      sub.frequency.exponentialRampToValueAtTime(50, BLOOM + 0.16)
      const subA = ctx.createGain()
      envAD(subA.gain, BLOOM, 0.5, 0.005, 0.6)
      sub.connect(subA).connect(bloom)
      sub.start(BLOOM)
      sub.stop(BLOOM + 0.7)
      const sub2 = ctx.createOscillator()
      sub2.type = 'triangle'
      sub2.frequency.setValueAtTime(236, BLOOM)
      sub2.frequency.exponentialRampToValueAtTime(100, BLOOM + 0.16)
      const sub2A = ctx.createGain()
      envAD(sub2A.gain, BLOOM, 0.1, 0.005, 0.35)
      sub2.connect(sub2A).connect(bloom)
      sub2.start(BLOOM)
      sub2.stop(BLOOM + 0.45)

      // Struck crystal: a bright inharmonic "shing" riding the attack.
      ;[[2350, 0.05, 0.9], [3180, 0.045, 0.65], [4270, 0.04, 0.5], [5610, 0.03, 0.36], [7330, 0.025, 0.28]]
        .forEach(([f, peak, t60]) => partial({ t0: BLOOM, freq: f, peak, t60, dest: bloom, attack: 0.001 }))

      // Air burst + a fluttering "fairy dust" hiss that outlives it.
      const air = noise(BLOOM, 0.9)
      const airHp = ctx.createBiquadFilter()
      airHp.type = 'highpass'
      airHp.frequency.value = 5500
      const airA = ctx.createGain()
      envAD(airA.gain, BLOOM, 0.11, 0.003, 0.85)
      air.connect(airHp).connect(airA).connect(bloom)

      const dust = noise(BLOOM, 1.6)
      const dustBp = ctx.createBiquadFilter()
      dustBp.type = 'bandpass'
      dustBp.frequency.value = 9000
      dustBp.Q.value = 0.8
      const dustA = ctx.createGain()
      dustA.gain.value = 0
      dustA.gain.setValueAtTime(0, BLOOM)
      dustA.gain.linearRampToValueAtTime(0.07, BLOOM + 0.06)
      dustA.gain.setTargetAtTime(0, BLOOM + 0.06, 0.34)
      const flutter = ctx.createGain()
      flutter.gain.value = 0.5
      const fl = ctx.createOscillator()
      fl.frequency.value = 13
      const flD = ctx.createGain()
      flD.gain.value = 0.5
      fl.connect(flD).connect(flutter.gain)
      fl.start(BLOOM)
      fl.stop(BLOOM + 1.6)
      dust.connect(dustBp).connect(dustA).connect(flutter).connect(bloom)

      glitterSpray(BLOOM + 0.004, 0.8, 46, 0.055, bloom)
    }

    // ── 3. The arpeggio (0.44 – 1.43) ─────────────────────────────────────
    const arp = layer('arp', 1, 0.45)
    {
      // A short echo on the arpeggio only: repeats that thicken the climb.
      const delay = ctx.createDelay(1)
      delay.delayTime.value = 0.155
      const fb = ctx.createGain()
      fb.gain.value = 0.3
      const dlp = ctx.createBiquadFilter()
      dlp.type = 'lowpass'
      dlp.frequency.value = 5200
      const echo = ctx.createGain()
      echo.gain.value = 0.24
      const voice = ctx.createGain()
      voice.connect(arp)
      voice.connect(delay)
      delay.connect(dlp).connect(fb).connect(delay)
      dlp.connect(echo).connect(arp)

      // D-major pentatonic, D5 → D7, accelerating 118 ms → 80 ms apart.
      const notes = [74, 76, 78, 81, 83, 86, 88, 90, 93, 95, 98]
      let t = BLOOM + 0.09
      notes.forEach((m, i) => {
        const last = i === notes.length - 1
        const f = hz(m)
        const k = i / (notes.length - 1)
        const peak = last ? 0.2 : 0.135 + 0.02 * k
        const t60 = last ? 1.9 : 1.25 - 0.45 * k
        fm({ t0: t, freq: f, ratio: 4, index0: last ? 1.0 : 1.3 - 0.5 * k, index1: 0.04, indexTime: 0.16, peak, t60, dest: voice, attack: 0.002 })
        partial({ t0: t, freq: f * 2, peak: peak * 0.22, t60: 0.45, dest: voice })
        if (last) {
          // The crown: an octave halo, a low support dyad, and fresh glitter.
          partial({ t0: t, freq: f * 2, peak: 0.05, t60: 1.1, dest: voice, attack: 0.004 })
          fm({ t0: t, freq: hz(74), ratio: 3.5, index0: 0.9, index1: 0.08, indexTime: 0.7, peak: 0.07, t60: 1.7, dest: arp })
          fm({ t0: t, freq: hz(81), ratio: 3.5, index0: 0.9, index1: 0.08, indexTime: 0.7, peak: 0.06, t60: 1.6, dest: arp })
          glitterSpray(t + 0.01, 0.45, 14, 0.04, arp)
        }
        t += 0.118 - 0.038 * (i / (notes.length - 2))
      })
    }

    // ── 4. The choir pad (0.33 → release from 1.95) ───────────────────────
    const pad = layer('pad', 0.85, 0.6)
    {
      // "Aah": a formant bank (F1 730, F2 1090, F3 2440) on detuned saws,
      // plus a darker body path, plus a little breath.
      const src = ctx.createGain()
      for (const [f, q, g] of [[730, 7, 1], [1090, 9, 0.5], [2440, 12, 0.28]]) {
        const bp = ctx.createBiquadFilter()
        bp.type = 'bandpass'
        bp.frequency.value = f
        bp.Q.value = q
        const gg = ctx.createGain()
        gg.gain.value = g
        src.connect(bp).connect(gg).connect(pad)
      }
      const body = ctx.createBiquadFilter()
      body.type = 'lowpass'
      body.frequency.value = 900
      body.Q.value = 0.5
      const bodyG = ctx.createGain()
      bodyG.gain.value = 0.3
      src.connect(body).connect(bodyG).connect(pad)

      const env = ctx.createGain()
      env.gain.value = 0
      env.gain.setValueAtTime(0, 0.33)
      env.gain.setTargetAtTime(1, 0.33, 0.3)
      env.gain.setTargetAtTime(0, 1.95, 0.33)
      env.connect(src)

      // Dmaj9 without the low third: D3 D4 A4 C#5 E5 F#5.
      ;[[50, 0.5], [62, 1], [69, 0.9], [73, 0.75], [76, 0.7], [78, 0.65]].forEach(([m, lvl], vi) => {
        const lfo = ctx.createOscillator()
        lfo.frequency.value = 4.8 + vi * 0.23
        const lfoD = ctx.createGain()
        lfoD.gain.value = 4
        lfo.connect(lfoD)
        lfo.start(0.3)
        lfo.stop(LENGTH_S)
        for (const cents of [-9, 0, 8]) {
          const o = ctx.createOscillator()
          o.type = 'sawtooth'
          o.frequency.value = hz(m)
          o.detune.value = cents
          lfoD.connect(o.detune)
          const g = ctx.createGain()
          g.gain.value = 0.1 * lvl
          o.connect(g).connect(env)
          o.start(0.3)
          o.stop(LENGTH_S)
        }
      })

      const breath = noise(0.3, LENGTH_S - 0.3)
      const bg = ctx.createGain()
      bg.gain.value = 0.08
      breath.connect(bg).connect(env)
    }

    const rendered = await ctx.startRendering()
    const pcm = rendered.getChannelData(0)
    const bytes = new Uint8Array(pcm.buffer, pcm.byteOffset, pcm.byteLength)
    let s = ''
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000))
    return { sampleRate: SR, length: pcm.length, bloom: BLOOM, pcm: btoa(s) }
  }
})()
</script>
