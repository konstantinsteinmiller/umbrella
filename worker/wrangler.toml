name = "elemental-barrage-leaderboard"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "elemental-barrage-leaderboard"
# Elemental Barrage's own database (created 2026-09-23, region EEUR) — never
# point this at another game's board, the scores would mix.
database_id = "6187430c-b73f-4a18-9434-0f540c79a820"

[vars]
# Empty = allow any origin. Every portal build serves the game from a different
# origin and a sandboxed iframe sends `null`, so an allowlist is opt-in.
ALLOWED_ORIGINS = ""
# SCORE_SECRET is deliberately NOT here — `wrangler secret put SCORE_SECRET`.
